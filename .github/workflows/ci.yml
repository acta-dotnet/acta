name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but never interrupt a tag/release build mid-flight.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Format + emit drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Actions are pinned to full commit SHAs so a retargeted or compromised tag cannot change
      # what runs in a release build. The comment after each pin records the tag it resolved from.
      - name: Enforce SHA-pinned actions
        run: |
          if grep -nE 'uses:[^#]*@(v[0-9]|main|master)' .github/workflows/*.yml; then
            echo 'Workflow actions must be pinned to full commit SHAs (uses: owner/repo@<sha> # vX.Y.Z).'
            exit 1
          fi
      - name: Docs link check
        run: bash tools/check-md-links.sh
      - name: Provider SQL changed-sibling report
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tools/sql-compare.ps1 -ChangedSince $env:BASE_SHA | Tee-Object -FilePath sql-siblings.md
          Get-Content sql-siblings.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Restore tools
        run: dotnet tool restore
      - name: CSharpier format check
        run: dotnet csharpier check .
      - name: Emit drift-check
        run: dotnet run --project tools/Acta.Emit -- check

  dashboard:
    name: Dashboard build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Acta.AspNetCore/DashboardApp/package-lock.json
      - name: npm ci
        working-directory: src/Acta.AspNetCore/DashboardApp
        run: npm ci
      - name: npm test
        working-directory: src/Acta.AspNetCore/DashboardApp
        run: npm test
      # `npm test` is svelte-check + helpers + components. The Playwright smoke drives the real routes end to
      # end (job investigation, controls, quick search, read-only deployment, mobile and appearance),
      # with every API call mocked in the spec, so it needs no .NET host and no database - just Vite,
      # which its own playwright.config webServer starts. 8 tests, a few seconds.
      - name: Install Playwright browser
        working-directory: src/Acta.AspNetCore/DashboardApp
        run: npx playwright install --with-deps chromium
      - name: Dashboard smoke (Playwright)
        working-directory: src/Acta.AspNetCore/DashboardApp
        run: npm run test:smoke
      - name: npm run build
        working-directory: src/Acta.AspNetCore/DashboardApp
        run: npm run build
      - name: Verify dashboard assets
        run: test -f src/Acta.AspNetCore/DashboardApp/dist/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: src/Acta.AspNetCore/DashboardApp/dist
          if-no-files-found: error

  build-test:
    name: Build + test (all providers)
    runs-on: ubuntu-latest
    needs: [quality, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: src/Acta.AspNetCore/DashboardApp/dist
      - name: Verify dashboard assets
        run: test -f src/Acta.AspNetCore/DashboardApp/dist/index.html
      # Central package management without a lock file: key the restore cache on the package manifests
      # and SDK pin, so a graph change invalidates it.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Disposable, localhost-bound test DBs. Compose keeps its committed defaults (which match
      # tests/Acta.runsettings); no GitHub Secrets and no CI password override are needed.
      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 300
      - name: Restore
        run: dotnet restore Acta.slnx
      - name: Build
        run: dotnet build Acta.slnx -c Release --no-restore /p:ActaDashboardSkipNpm=true
      - name: Test
        run: dotnet test Acta.slnx -c Release --no-build --settings tests/Acta.runsettings --logger trx
      - name: Capture database logs
        if: failure()
        run: docker compose logs --no-color > db-logs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: db-logs
          path: db-logs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          # warn (not error): on a build failure the Test step is skipped and produces no .trx;
          # an always() upload must not turn that into a second, misleading failure.
          if-no-files-found: warn
      - name: Stop databases
        if: always()
        run: docker compose down -v

  demos:
    name: Demos build (published packages)
    runs-on: ubuntu-latest
    needs: [quality]
    # demos/ are deliberately outside Acta.slnx: they consume the published NuGet packages, so what a
    # reader sees is what they would write. That also meant nothing ever compiled them, and a demo
    # could rot against a shipped package without CI noticing. This restores from nuget.org against
    # the versions pinned in demos/Directory.Packages.props, so it fails when a pinned package and
    # the demo source disagree - which is exactly the signal wanted.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-demos-${{ runner.os }}-${{ hashFiles('demos/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-demos-${{ runner.os }}-
      - name: Build AcmeShop
        run: dotnet build demos/AcmeShop -c Release
      - name: Build ApiWorkerSplit
        run: dotnet build demos/ApiWorkerSplit -c Release

  pack-smoke:
    name: Pack + package smoke
    runs-on: ubuntu-latest
    needs: [quality, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: src/Acta.AspNetCore/DashboardApp/dist
      - name: Verify dashboard assets
        run: test -f src/Acta.AspNetCore/DashboardApp/dist/index.html
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Pack the shippable libraries by explicit list, not the whole solution: packing Acta.slnx
      # also walks the Web SDK app projects (anvil/Anvil, demos) and emits pack warnings for them.
      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            'src/Acta/Acta.csproj',
            'src/Acta.Runtime/Acta.Runtime.csproj',
            'src/Acta.Relational/Acta.Relational.csproj',
            'src/Acta.AspNetCore/Acta.AspNetCore.csproj',
            'src/Acta.Postgres/Acta.Postgres.csproj',
            'src/Acta.Sqlite/Acta.Sqlite.csproj',
            'src/Acta.SqlServer/Acta.SqlServer.csproj',
            'src/Acta.Redis/Acta.Redis.csproj',
            'src/Acta.Testing/Acta.Testing.csproj'
          )
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts /p:ActaDashboardSkipNpm=true --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package smoke
        shell: pwsh
        run: tests/PackageSmoke/run.ps1 -ExistingFeed artifacts
      # Every code sample a newcomer meets, compiled as a complete program from these same packages.
      - name: Doc sample compile
        shell: pwsh
        run: tests/DocSamples/run.ps1 -ExistingFeed artifacts
      # Retained hash manifest ties the published bytes back to this run and commit (the recorded
      # provenance policy for the release; see the publish job).
      - name: Hash packages
        shell: pwsh
        run: |
          Get-FileHash artifacts/*.nupkg, artifacts/*.snupkg -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  aot-publish:
    name: NativeAOT publish guardrail
    runs-on: ubuntu-latest
    needs: [quality]
    # Off the PR path (native compile is slow): runs only on push to main / tags, not per pull request.
    # Accepted risk, stated so nobody has to rediscover it: a pull request that breaks native compile
    # goes green, and the break surfaces on the merge to main instead. Trim-warning analysis still
    # runs on every build (IsAotCompatible), so a PR is not entirely blind to it - only the native
    # link step is deferred.
    # Drives NativeAotPublishTests, which runs `dotnet publish -p:PublishAot=true` on anvil/Anvil and asserts
    # a clean native compile (ACTA_AOT_PUBLISH_TEST=1 enables the otherwise-skipped test).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # NativeAOT needs a native toolchain (clang + zlib) on the ubuntu runner; the ILCompiler package
      # itself comes in transitively via PublishAot on the pinned SDK, so no hand-pinned version here.
      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Run NativeAOT publish guardrail
        env:
          ACTA_AOT_PUBLISH_TEST: '1'
        run: dotnet test tests/Acta.Tests/Acta.Tests.csproj -c Release --filter "FullyQualifiedName~NativeAotPublishTests" --logger trx

  # Publishes the pack-smoke artifact to nuget.org on v* tags via Trusted Publishing (OIDC, no
  # long-lived API key): NuGet/login exchanges the GitHub OIDC token for a 1-hour key scoped by
  # the nuget.org policy (repo acta-dotnet/acta, workflow ci.yml, environment release).
  #
  # Provenance policy: package identity is established by Trusted Publishing (the OIDC exchange ties
  # the upload to this repo/workflow/environment), SHA-pinned actions (enforced above), and the
  # retained `packages` artifact of the tag run, whose run URL and commit connect the published
  # bytes to the reviewed source. Author signing and SBOM generation are deliberately deferred until
  # after 0.3.0-alpha.1; nuget.org repository-signs all packages on ingestion regardless.
  publish-nuget:
    name: Publish to nuget.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-test, pack-smoke, aot-publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushing *.nupkg also uploads each sibling *.snupkg; --skip-duplicate keeps re-runs safe.
      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
