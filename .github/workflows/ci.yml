name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but never interrupt a tag/release build mid-flight.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Format + emit drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Actions are pinned to full commit SHAs so a retargeted or compromised tag cannot change
      # what runs in a release build. The comment after each pin records the tag it resolved from.
      - name: Enforce SHA-pinned actions
        run: |
          if grep -nE 'uses:[^#]*@(v[0-9]|main|master)' .github/workflows/*.yml; then
            echo 'Workflow actions must be pinned to full commit SHAs (uses: owner/repo@<sha> # vX.Y.Z).'
            exit 1
          fi
      - name: Restore tools
        run: dotnet tool restore
      - name: CSharpier format check
        run: dotnet csharpier check .
      - name: Emit drift-check
        run: dotnet run --project tools/Acta.Emit -- check

  dashboard:
    name: Dashboard build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Acta.Dashboard/DashboardApp/package-lock.json
      - name: npm ci
        working-directory: src/Acta.Dashboard/DashboardApp
        run: npm ci
      - name: npm test
        working-directory: src/Acta.Dashboard/DashboardApp
        run: npm test
      # `npm test` is svelte-check + helpers + components. The Playwright smoke drives the real routes end to
      # end (job investigation, controls, quick search, read-only deployment, mobile and appearance),
      # with every API call mocked in the spec, so it needs no .NET host and no database - just Vite,
      # which its own playwright.config webServer starts. It also scans the states it stages for accessibility.
      - name: Install Playwright browser
        working-directory: src/Acta.Dashboard/DashboardApp
        run: npx playwright install --with-deps chromium
      - name: Dashboard smoke (Playwright)
        working-directory: src/Acta.Dashboard/DashboardApp
        run: npm run test:smoke
      - name: npm run build
        working-directory: src/Acta.Dashboard/DashboardApp
        run: npm run build
      # The dist is embedded in the NuGet package, so bundle size is package size. This fails the
      # build when the bundle grows past the budget in scripts/size-budget.mjs, which also records
      # why the dashboard ships as one file rather than split chunks.
      - name: Dashboard size budget
        working-directory: src/Acta.Dashboard/DashboardApp
        run: npm run size
      - name: Verify dashboard assets
        run: test -f src/Acta.Dashboard/DashboardApp/dist/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-dist
          path: src/Acta.Dashboard/DashboardApp/dist
          if-no-files-found: error

  build-test:
    name: Build + test (all providers)
    runs-on: ubuntu-latest
    # The job takes about ten minutes; a hang must not run to the six-hour default.
    timeout-minutes: 45
    needs: [quality, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: src/Acta.Dashboard/DashboardApp/dist
      - name: Verify dashboard assets
        run: test -f src/Acta.Dashboard/DashboardApp/dist/index.html
      # Central package management without a lock file: key the restore cache on the package manifests
      # and SDK pin, so a graph change invalidates it.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Disposable, localhost-bound test DBs. Compose keeps its committed defaults (which match
      # tests/Acta.runsettings); no GitHub Secrets and no CI password override are needed.
      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 300
      - name: Restore
        run: dotnet restore Acta.slnx
      - name: Build
        run: dotnet build Acta.slnx -c Release --no-restore /p:ActaDashboardSkipNpm=true
      - name: Test
        run: dotnet test Acta.slnx -c Release --no-build --settings tests/Acta.runsettings --logger trx --blame-hang-timeout 5m
      # The SQL Server suite again with READ_COMMITTED_SNAPSHOT off, against its own -rcsioff catalog: Acta must run
      # in a database whose owner left the option off.
      - name: Test SQL Server without RCSI
        env:
          ACTA_TEST_MSSQL_RCSI: 'off'
        run: dotnet test tests/Acta.Tests.Conformance.SqlServer -c Release --no-build --settings tests/Acta.runsettings --logger trx --blame-hang-timeout 5m
      # The concept samples have their own solution so a solution build covers only the product; they still
      # compile and run here, against the src projects built above.
      - name: Build concepts
        run: dotnet build concepts/Concepts.slnx -c Release /p:ActaDashboardSkipNpm=true
      - name: Test concepts
        run: dotnet test concepts/Concepts.slnx -c Release --no-build --settings tests/Acta.runsettings --logger trx --blame-hang-timeout 5m
      - name: Deadlock report
        if: always()
        run: bash .github/scripts/deadlock-report.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: db-logs
          path: db-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          # The sequence file names the tests a hang interrupted.
          path: |
            **/*.trx
            **/Sequence_*.xml
          # warn (not error): on a build failure the Test step is skipped and produces no .trx;
          # an always() upload must not turn that into a second, misleading failure.
          if-no-files-found: warn
      - name: Stop databases
        if: always()
        run: docker compose down -v

  # Every supported SQL Server major passes the SQL Server suite with READ_COMMITTED_SNAPSHOT on and off; build-test
  # covers 2022, the compose default.
  sqlserver-majors:
    name: SQL Server ${{ matrix.version }} (RCSI on and off)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, dashboard]
    strategy:
      fail-fast: false
      matrix:
        version: ['2019', '2025']
    env:
      ACTA_MSSQL_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: src/Acta.Dashboard/DashboardApp/dist
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Start SQL Server
        run: docker compose up -d --wait --wait-timeout 300 sqlserver
      - name: Build
        run: dotnet build tests/Acta.Tests.Conformance.SqlServer -c Release /p:ActaDashboardSkipNpm=true
      - name: Test
        run: dotnet test tests/Acta.Tests.Conformance.SqlServer -c Release --no-build --settings tests/Acta.runsettings --logger trx --blame-hang-timeout 5m
      - name: Test without RCSI
        env:
          ACTA_TEST_MSSQL_RCSI: 'off'
        run: dotnet test tests/Acta.Tests.Conformance.SqlServer -c Release --no-build --settings tests/Acta.runsettings --logger trx --blame-hang-timeout 5m
      - name: Deadlock report
        if: always()
        run: bash .github/scripts/deadlock-report.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: db-logs-sqlserver-${{ matrix.version }}
          path: db-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-sqlserver-${{ matrix.version }}
          path: '**/*.trx'
          if-no-files-found: warn
      - name: Stop SQL Server
        if: always()
        run: docker compose down -v

  # Acta ships net10.0 only. This job holds the claim that those packages run on .NET 11: the suites again with every
  # test host rolled forward to the 11 runtime, then a net11.0 consumer built by the 11 SDK from the packed feed.
  # build-test keeps the axes that do not change with the runtime: RCSI off, the concept samples.
  net11:
    name: .NET 11 (suites on the runtime, consumer on the SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, dashboard, pack-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # global.json still picks the SDK that builds. The second version adds the 11 runtime for the test hosts and
      # the 11 SDK for the consumer.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 11.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: src/Acta.Dashboard/DashboardApp/dist
      - name: Verify dashboard assets
        run: test -f src/Acta.Dashboard/DashboardApp/dist/index.html
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Start databases
        run: docker compose up -d --wait --wait-timeout 300
      # RollForward goes into each runtimeconfig.json, so a net10.0 test host starts on the newest runtime installed.
      - name: Build
        run: dotnet build Acta.slnx -c Release /p:ActaDashboardSkipNpm=true /p:RollForward=LatestMajor
      - name: Every test host rolls forward
        run: |
          configs=$(ls tests/*/bin/Release/net10.0/*.runtimeconfig.json)
          missing=$(grep -L '"rollForward": "LatestMajor"' $configs || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            echo 'These test hosts would start on the runtime they target.'
            exit 1
          fi
      # RuntimeVersionTests fails the run unless the newest runtime installed is the major named here.
      - name: Test on the .NET 11 runtime
        env:
          ACTA_TEST_DOTNET_MAJOR: '11'
        run: dotnet test Acta.slnx -c Release --no-build --settings tests/Acta.runsettings --logger trx --blame-hang-timeout 5m
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      # Every dotnet command after this one runs on the 11 SDK, so it stays the last step but the consumer's.
      - name: Select the .NET 11 SDK
        run: dotnet new globaljson --sdk-version 11.0.100 --roll-forward latestFeature --force
      - name: Package smoke as a net11.0 consumer
        shell: pwsh
        run: tests/PackageSmoke/run.ps1 -ExistingFeed artifacts -Framework net11.0
      - name: Deadlock report
        if: always()
        run: bash .github/scripts/deadlock-report.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: db-logs-net11
          path: db-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-net11
          path: |
            **/*.trx
            **/Sequence_*.xml
          if-no-files-found: warn
      - name: Stop databases
        if: always()
        run: docker compose down -v

  demos:
    name: Demos build (published packages)
    runs-on: ubuntu-latest
    needs: [quality]
    # demos/ are deliberately outside Acta.slnx: they consume the published NuGet packages, so what a
    # reader sees is what they would write. That also meant nothing ever compiled them, and a demo
    # could rot against a shipped package without CI noticing. This restores from nuget.org against
    # the versions pinned in demos/Directory.Packages.props, so it fails when a pinned package and
    # the demo source disagree - which is exactly the signal wanted.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-demos-${{ runner.os }}-${{ hashFiles('demos/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-demos-${{ runner.os }}-
      - name: Build AcmeShop
        run: dotnet build demos/AcmeShop -c Release
      - name: Build ApiWorkerSplit
        run: dotnet build demos/ApiWorkerSplit -c Release

  pack-smoke:
    name: Pack + package smoke
    runs-on: ubuntu-latest
    needs: [quality, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: src/Acta.Dashboard/DashboardApp/dist
      - name: Verify dashboard assets
        run: test -f src/Acta.Dashboard/DashboardApp/dist/index.html
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # Pack the shippable libraries by explicit list, not the whole solution: packing Acta.slnx
      # also walks the Web SDK app projects (anvil/Anvil, demos) and emits pack warnings for them.
      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            'src/Acta/Acta.csproj',
            'src/Acta.AspNetCore/Acta.AspNetCore.csproj',
            'src/Acta.Dashboard/Acta.Dashboard.csproj',
            'src/Acta.Postgres/Acta.Postgres.csproj',
            'src/Acta.Sqlite/Acta.Sqlite.csproj',
            'src/Acta.SqlServer/Acta.SqlServer.csproj',
            'src/Acta.Redis/Acta.Redis.csproj',
            'src/Acta.Testing/Acta.Testing.csproj'
          )
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts /p:ActaDashboardSkipNpm=true --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package smoke
        shell: pwsh
        run: tests/PackageSmoke/run.ps1 -ExistingFeed artifacts
      # Retained hash manifest ties the published bytes back to this run and commit (the recorded
      # provenance policy for the release; see the publish job).
      - name: Hash packages
        shell: pwsh
        run: |
          Get-FileHash artifacts/*.nupkg, artifacts/*.snupkg -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

  aot-publish:
    name: NativeAOT publish guardrail
    runs-on: ubuntu-latest
    needs: [quality]
    # Off the PR path (native compile is slow): runs only on push to main / tags, not per pull request.
    # Accepted risk, stated so nobody has to rediscover it: a pull request that breaks native compile
    # goes green, and the break surfaces on the merge to main instead. Trim-warning analysis still
    # runs on every build (IsAotCompatible), so a PR is not entirely blind to it - only the native
    # link step is deferred.
    # Drives NativeAotPublishTests, which publishes anvil/Anvil and tools/Acta.Verify with NativeAOT, then runs
    # one SQLite checkpoint case on the native bench, with no capacity claim or chaos on the shared runner
    # (ACTA_AOT_PUBLISH_TEST=1 enables the otherwise-skipped test).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # NativeAOT needs a native toolchain (clang + zlib) on the ubuntu runner; the ILCompiler package
      # itself comes in transitively via PublishAot on the pinned SDK, so no hand-pinned version here.
      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Run NativeAOT publish guardrail
        env:
          ACTA_AOT_PUBLISH_TEST: '1'
        run: dotnet test tests/Acta.Tests/Acta.Tests.csproj -c Release --filter "FullyQualifiedName~NativeAotPublishTests" --logger trx

  # Publishes the pack-smoke artifact to nuget.org on v* tags via Trusted Publishing (OIDC, no
  # long-lived API key): NuGet/login exchanges the GitHub OIDC token for a 1-hour key scoped by
  # the nuget.org policy (repo acta-dotnet/acta, workflow ci.yml, environment release).
  #
  # Provenance policy: package identity is established by Trusted Publishing (the OIDC exchange ties
  # the upload to this repo/workflow/environment), SHA-pinned actions (enforced above), and the
  # retained `packages` artifact of the tag run, whose run URL and commit connect the published
  # bytes to the reviewed source. Author signing and SBOM generation are deliberately deferred until
  # after 0.3.0-alpha.1; nuget.org repository-signs all packages on ingestion regardless.
  publish-nuget:
    name: Publish to nuget.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-test, sqlserver-majors, pack-smoke, aot-publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushing *.nupkg also uploads each sibling *.snupkg; --skip-duplicate keeps re-runs safe.
      - name: Push packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
